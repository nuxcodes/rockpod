wps: /.rockbox/wps/Themify_2.wps
sbs: /.rockbox/wps/Themify_2.sbs
font: /.rockbox/fonts/22-LeagueSpartan-Regular.fnt

show icons: on
scrollbar: right
battery display: numeric
time format: 12hour

foreground color: 00fbd6
background color: 000c21

# The SBS draws its own selector with %Vs(invert), so these are only read
# by code that bypasses the SBS -- notably the PictureFlow track list,
# which fills its selector bar with the selector start color and draws the
# highlighted row in the selector text color. Left unset they fall back to
# whatever is in the user's global settings, which is why the highlighted
# track could come out unreadable. Mirror what %Vs(invert) does.
line selector start color: 00fbd6
line selector end color: 00fbd6
line selector text color: 000c21

scroll speed: 14
scroll delay: 1500
scroll step: 1

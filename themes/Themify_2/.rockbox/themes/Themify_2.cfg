wps: /.rockbox/wps/Themify_2.wps
sbs: /.rockbox/wps/Themify_2.sbs
font: /.rockbox/fonts/22-LeagueSpartan-Regular.fnt

show icons: on
scrollbar: right
battery display: numeric
time format: 12hour

foreground color: 00fbd6
background color: 000c21

# This theme's menus are drawn by the skin, which inverts the selected
# row -- the bar takes the foreground colour and the text the
# background. Code that draws its own lists, such as the PictureFlow
# track list, follows this setting instead, so naming the inverting
# style keeps the two consistent and, unlike hardcoding the selector
# colours, it tracks any later edit to the foreground or background.
# A .cfg cannot say "use the foreground colour" -- colour settings only
# accept literal hex -- so this is the way to express it.
selector type: bar (inverse)

scroll speed: 14
scroll delay: 1500
scroll step: 1
